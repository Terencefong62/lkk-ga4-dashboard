name: Refresh GA4 snapshot

# Daily refresh at 08:00 Asia/Shanghai. A successful pull rewrites the live
# dashboard JavaScript (data.js, chunks/, duration.js, sources.js,
# drivers-complete.js, and the patch files index.html still loads) and commits
# that snapshot to main. It does not commit the service-account JSON or the
# snapshot-refresh/ artifact.
on:
  schedule:
    # 08:00 Asia/Shanghai, every day (GitHub schedules use UTC).
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: Inclusive start date (YYYY-MM-DD). Blank uses 1 January in Asia/Hong_Kong.
        required: false
        default: ""
      end_date:
        description: Inclusive end date (YYYY-MM-DD). Blank uses yesterday in Asia/Hong_Kong.
        required: false
        default: ""
      property_ids:
        description: Comma-separated GA4 property IDs. Blank reads every property the service account can access.
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ga4-snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dashboard
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the official Google Analytics MCP server
        run: pip install -r scripts/requirements-ga4-refresh.txt

      - name: Refresh snapshot JSON
        env:
          # The GitHub Actions secret must be named GA4_SERVICE_ACCOUNT_JSON
          # and must contain the service account JSON. Do not commit that JSON.
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
          GA4_START_DATE: ${{ inputs.start_date }}
          GA4_END_DATE: ${{ inputs.end_date }}
          GA4_PROPERTY_IDS: ${{ inputs.property_ids }}
        run: python scripts/refresh_ga4_snapshot.py --out snapshot-refresh

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: ga4-snapshot
          path: snapshot-refresh/ga4-snapshot.json
          if-no-files-found: error

      - name: Publish live snapshot files
        run: python scripts/refresh_ga4_snapshot.py --from-json snapshot-refresh/ga4-snapshot.json --publish-live

      - name: Refresh product page origins
        env:
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: python scripts/fetch_product_origin.py

      - name: Commit live snapshot to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data.js \
            duration.js \
            extensions.js \
            magnetic.js \
            refresh.js \
            sources.js \
            drivers-complete.js \
            drivers-country-extra.js \
            index.html \
            product-origin.js \
            chunks \
            delta-*.js
          if git diff --cached --name-only | grep -E '(snapshot-refresh|service.account|service_account|ga4-mcp-|ga4-sa-)'; then
            echo "Refusing to commit credentials or the raw snapshot directory." >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Live snapshot files were unchanged."
            exit 0
          fi
          git commit -m "Refresh GA4 live snapshot"
          git fetch origin main
          git pull --rebase origin main
          git push origin HEAD:main
